<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2a241c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Magical Abacus" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
  <title>Magical Abacus</title>
  <style>
    :root {
      --wood-dark: #2a2a2a;
      --wood-mid: #4a4a4a;
      --wood-light: #7a7a7a;
      --brass: #c4a35a;
      --brass-dark: #8a6d32;
      --brass-shine: #e8d090;
      --card-gold: #d7b65f;
      --card-gold-dark: #76551d;
      --rod: #8a8a8a;
      --rod-dark: #4a4a4a;
      --paper: #efe6d4;
      --ink: #2a241c;
      --bar: #2e2e2e;
      --top-bead: #2c2c2c;
      --top-bead-hi: #5a5a5a;
      --mid-bead: #111111;
      --mid-bead-hi: #3a3a3a;
      --bot-bead: #6a6a6a;
      --bot-bead-hi: #9a9a9a;
      --rail: 18px;
      --bar-h: 14px;
      --bar-clearance: 24px;
      --bead-w: clamp(28px, 9vw, 42px);
      --bead-h: clamp(18px, 5.4vw, 26px);
      --gap: 2px;
      --unit: calc(var(--bead-h) + var(--gap));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: radial-gradient(ellipse at 50% 0%, #f7f1e4 0%, var(--paper) 55%, #cfc6b4 100%);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      color: var(--ink);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 10px calc(14px + env(safe-area-inset-bottom));
      gap: 6px;
    }
    .abacus-view { display: contents; }
    .abacus-view[hidden],
    .arcana-view[hidden] { display: none; }
    h1 {
      font-size: clamp(1.15rem, 3.6vw, 1.65rem);
      letter-spacing: 0.1em;
      font-weight: 600;
      text-transform: uppercase;
      text-shadow: none;
    }
    .readouts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: end;
    }
    .readout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      min-width: 8rem;
    }
    .readout .lbl {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      opacity: 0.55;
    }
    .readout .num {
      font-size: clamp(1.4rem, 5.4vw, 2.2rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      line-height: 1.15;
      text-shadow: none;
    }
    .readout .num sup {
      font-size: 0.55em;
      line-height: 0;
    }
    .formula {
      font-size: 0.75rem;
      opacity: 0.65;
      text-align: center;
      max-width: 94vw;
    }
    .toolbar {
      display: grid;
      place-items: center;
      width: 100%;
      margin: 8px 0 10px;
    }
    button.ctrl {
      appearance: none;
      border: 1px solid #6a6458;
      background: linear-gradient(#f3eee3, #d4cec0);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.86rem;
      letter-spacing: 0.04em;
      box-shadow: 0 2px 0 #6a6458, inset 0 1px 0 #fffaf0;
      cursor: pointer;
    }
    button.ctrl:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #6a6458;
    }
    .set-wrap {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
    }
    .set-field {
      width: min(18rem, 70vw);
      min-height: 2.15rem;
      text-align: center;
      box-shadow: inset 0 1px 3px rgba(40,36,28,0.25);
      background: #f4efe4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      border: 1px solid #6a6458;
      border-radius: 4px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: clamp(0.92rem, 4.2vw, 1.2rem);
      line-height: 1;
      white-space: nowrap;
    }
    .set-field.open { outline: none; }
    .keypad {
      display: none;
      width: min(96vw, 520px);
      padding: 10px;
      border-radius: 12px;
      background: linear-gradient(#f4efe4, #ddd6c8);
      box-shadow: 0 0 0 2px #4a463e, 0 0 0 5px #b8b0a0, 0 12px 28px rgba(24,20,16,0.28);
    }
    .keypad.show { display: block; }
    .keypad-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      opacity: 0.7;
    }
    .keypad-actions { display: flex; gap: 6px; }
    .keypad-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr) 3.05rem;
      grid-template-rows: repeat(6, auto);
      gap: 6px;
    }
    .keypad-board .key.op-plus  { grid-column: 6; grid-row: 2 / span 2; }
    .keypad-board .key.op-minus { grid-column: 6; grid-row: 5 / span 2; }
    .keypad-board .key.op-multiply {
      grid-column: 6;
      grid-row: 1;
    }
    .keypad-board .key.op-zero  {
      grid-column: 6;
      grid-row: 4;
      font-weight: 400;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
    }
    .key {
      appearance: none;
      border: 1px solid #4f4a42;
      background: linear-gradient(#ece7dc, #cfc8b8);
      color: var(--ink);
      border-radius: 10px;
      min-height: 40px;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      line-height: 1.15;
      padding: 2px 3px;
      white-space: normal;
      cursor: pointer;
      box-shadow: 0 3px 0 #4f4a42, inset 0 1px 0 #fffaf2;
    }
    .key:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #4f4a42;
    }
    .key.op {
      background: linear-gradient(#e8e2d4, #b8b0a0);
      height: 100%;
      min-height: 86px;
      font-size: 1.25rem;
      border: 1px solid #6a6458;
      box-shadow: 0 2px 0 #6a6458, inset 0 1px 0 #fffaf0;
    }
    .key.op-multiply,
    .key.op-zero {
      min-height: 40px;
    }
    .key.card {
      position: relative;
      padding: 2px;
      min-height: 78px;
      background: #2a2a2a;
      border: 1px solid #181818;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 0 #181818;
    }
    .key.card img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 74px;
      object-fit: cover;
      object-position: 50% 18%;
      border-radius: 5px;
      border: 2px solid var(--card-gold);
      box-shadow: inset 0 0 0 1px var(--card-gold-dark);
      pointer-events: none;
      background: #ece6d8;
      filter: grayscale(1) sepia(0.16) saturate(0.72) contrast(1.03) brightness(1.01);
    }
    .spread {
      --readout-w: min(92vw, 360px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      width: var(--readout-w);
      padding: 10px 0 6px;
      transform: translateY(8px);
    }
    .spread-row {
      display: grid;
      width: 100%;
    }
    .spread-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .spread-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }
    .spread-5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
    }
    .spread-card {
      display: block;
      width: 100%;
      aspect-ratio: 280 / 418;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(20,16,12,0.35);
    }
    .spread-card img {
      display: block;
      width: 100%;
      height: auto;
      min-height: 100%;
      object-fit: cover;
      object-position: 50% 18%;
      border-radius: 2px;
      background: #ece6d8;
      filter: grayscale(1) sepia(0.16) saturate(0.72) contrast(1.03) brightness(1.01);
    }
    .stage { width: min(94vw, 560px); }
    .plate {
      border-radius: 10px;
      padding: 14px 12px 10px;
      background: #ece6d8;
      box-shadow: 0 0 0 3px #1c1c1c, 0 0 0 6px #8a8a8a, 0 18px 40px rgba(20,16,12,0.28);
    }
    .abacus {
      position: relative;
      display: grid;
      grid-template-rows:
        var(--rail)
        calc(var(--unit) + var(--unit) + var(--unit) + var(--unit) + var(--bar-clearance))
        var(--bar-h)
        calc(var(--unit) + var(--unit) + var(--unit) + var(--unit) + var(--unit) + var(--bar-clearance))
        var(--rail);
      grid-template-columns: var(--rail) repeat(5, 1fr) var(--rail);
      background: radial-gradient(ellipse at 50% 40%, #f4efe4 0%, #d8d2c4 100%);
      border-radius: 3px;
    }
    .h-rail {
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 8px),
        linear-gradient(180deg, #6a6a6a, #3a3a3a 55%, #1c1c1c);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), inset 0 -3px 4px rgba(0,0,0,0.45);
    }
    .h-rail.top { grid-column: 1 / -1; grid-row: 1; }
    .h-rail.bot { grid-column: 1 / -1; grid-row: 5; }
    .bar {
      grid-column: 1 / -1;
      z-index: 6;
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 7px),
        linear-gradient(180deg, #5a5a5a, var(--bar) 40%, #111);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), inset 0 -2px 3px rgba(0,0,0,0.5);
    }
    .bar.reckoning { grid-row: 3; }
    .v-rail {
      background:
        repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 8px),
        linear-gradient(90deg, #6a6a6a, #3a3a3a 55%, #1c1c1c);
    }
    .v-rail.left { grid-column: 1; grid-row: 1 / -1; }
    .v-rail.right { grid-column: 7; grid-row: 1 / -1; }

    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 8;
      pointer-events: none;
    }
    .corner .arm {
      position: absolute;
      background: linear-gradient(180deg, #6a6a6a, #2a2a2a);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .corner .arm.h { height: 7px; width: 28px; left: 0; }
    .corner .arm.v { width: 7px; height: 28px; top: 0; }
    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; }
    .corner.bl { bottom: 0; left: 0; }
    .corner.br { bottom: 0; right: 0; }
    .corner.tl .arm.h, .corner.tr .arm.h { top: 0; }
    .corner.bl .arm.h, .corner.br .arm.h { bottom: 0; }
    .corner.tl .arm.v, .corner.bl .arm.v { left: 0; }
    .corner.tr .arm.v, .corner.br .arm.v { right: 0; }
    .corner i {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #c8c8c8, #3a3a3a);
      box-shadow: 0 1px 1px rgba(0,0,0,0.4);
    }
    .corner.tl i:nth-of-type(1) { top: 7px; left: 7px; }
    .corner.tl i:nth-of-type(2) { top: 7px; left: 22px; }
    .corner.tl i:nth-of-type(3) { top: 22px; left: 7px; }
    .corner.tr i:nth-of-type(1) { top: 7px; right: 7px; }
    .corner.tr i:nth-of-type(2) { top: 7px; right: 22px; }
    .corner.tr i:nth-of-type(3) { top: 22px; right: 7px; }
    .corner.bl i:nth-of-type(1) { bottom: 7px; left: 7px; }
    .corner.bl i:nth-of-type(2) { bottom: 7px; left: 22px; }
    .corner.bl i:nth-of-type(3) { bottom: 22px; left: 7px; }
    .corner.br i:nth-of-type(1) { bottom: 7px; right: 7px; }
    .corner.br i:nth-of-type(2) { bottom: 7px; right: 22px; }
    .corner.br i:nth-of-type(3) { bottom: 22px; right: 7px; }

    .col {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .col.sixes {
      grid-row: 2;
      height: calc(var(--unit) + var(--unit) + var(--unit) + var(--unit) + var(--bar-clearance));
    }
    .col.ones {
      grid-row: 4;
      height: calc(var(--unit) + var(--unit) + var(--unit) + var(--unit) + var(--unit) + var(--bar-clearance));
    }
    .col.c0 { grid-column: 2; }
    .col.c1 { grid-column: 3; }
    .col.c2 { grid-column: 4; }
    .col.c3 { grid-column: 5; }
    .col.c4 { grid-column: 6; }

    .rod {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #c8c8c8, var(--rod) 35%, var(--rod-dark) 80%, #9a9a9a);
      box-shadow: 1px 0 2px rgba(0,0,0,0.4), inset 1px 0 0 rgba(255,255,255,0.28);
      z-index: 1;
    }

    .stack {
      position: relative;
      z-index: 2;
      width: 100%;
      flex: 1 1 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2px 0;
    }
    .group-on, .group-off {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap);
      flex: 0 0 auto;
    }
    .col.sixes .group-off { margin-top: 0; }
    .col.sixes .group-on { margin-top: auto; }
    .col.ones .group-off { margin-top: auto; }
    .col.ones .group-on { margin-top: 0; }

    .bead {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 0;
      width: var(--bead-w);
      height: var(--bead-h);
      flex: 0 0 var(--bead-h);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      position: relative;
      box-shadow: 0 2px 3px rgba(0,0,0,0.28);
      transition: filter 0.15s ease, transform 0.16s ease;
    }
    .bead:hover { filter: brightness(1.08); }
    .bead:active { transform: scale(0.96); }
    .bead::before {
      content: "";
      position: absolute;
      top: 18%;
      left: 28%;
      width: 28%;
      height: 22%;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      background: rgba(255,255,255,0.28);
      pointer-events: none;
    }
    .bead.top {
      background: radial-gradient(circle at 32% 28%, var(--top-bead-hi), var(--top-bead) 55%, #111);
    }
    .bead.mid {
      background: radial-gradient(circle at 32% 28%, var(--mid-bead-hi), var(--mid-bead) 55%, #000);
    }
    .bead.bot {
      background: radial-gradient(circle at 32% 28%, var(--bot-bead-hi), var(--bot-bead) 58%, #3a3a3a);
    }

    .places {
      display: grid;
      grid-template-columns: var(--rail) repeat(5, 1fr) var(--rail);
      margin-top: 8px;
      font-size: 0.7rem;
      letter-spacing: 0.03em;
      opacity: 0.72;
      text-align: center;
      line-height: 1.25;
    }
    .places .pad { visibility: hidden; }
    .places b { display: block; font-weight: 600; }
    .places i { font-style: normal; opacity: 0.75; font-size: 0.9em; }
    .learn-heading {
      width: min(94vw, 560px);
      margin: 16px 0 4px;
      text-align: center;
      font-size: clamp(1rem, 4vw, 1.35rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .learn-heading button {
      appearance: none;
      display: block;
      width: 100%;
      padding: 12px 16px 10px;
      border: 1px solid rgba(106, 100, 88, 0.34);
      border-radius: 5px;
      background: rgba(244, 239, 228, 0.3);
      box-shadow: 0 1px 0 rgba(106, 100, 88, 0.28), inset 0 1px 0 rgba(255, 250, 240, 0.42);
      color: rgba(42, 36, 28, 0.58);
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .learn-heading button:active {
      transform: translateY(1px);
      background: rgba(244, 239, 228, 0.48);
      color: rgba(42, 36, 28, 0.76);
      box-shadow: inset 0 1px 2px rgba(40, 36, 28, 0.12);
    }
    .arcana-view {
      width: 100%;
      min-height: 100vh;
    }
    .arcana-app {
      width: min(94vw, 520px);
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }
    .arcana-button {
      display: flex;
      width: 100%;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-color: #181818;
      box-shadow: 0 3px 0 #181818, inset 0 1px 0 #fffaf2;
      font-size: clamp(0.82rem, 3.6vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.2;
      white-space: normal;
    }
    .arcana-challenge,
    .arcana-reference-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(5px, 1.6vw, 9px);
    }
    .arcana-challenge { padding: 2px 0 4px; }
    .arcana-challenge-card,
    .arcana-reference-card {
      display: block;
      min-width: 0;
      aspect-ratio: 280 / 418;
      overflow: hidden;
      border-radius: 4px;
      background: #e7e0d2;
      box-shadow: 0 2px 6px rgba(20, 16, 12, 0.32);
    }
    .arcana-challenge-card img,
    .arcana-reference-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 18%;
      pointer-events: none;
      filter: grayscale(1) contrast(1.03) brightness(1.01);
    }
    .arcana-picker-window,
    .arcana-contemplation {
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      border: 2px solid rgba(74, 70, 62, 0.72);
      border-radius: 12px;
      background: rgba(236, 230, 216, 0.82);
      box-shadow: 0 5px 16px rgba(20, 16, 12, 0.16);
      -webkit-overflow-scrolling: touch;
    }
    .arcana-picker-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      padding: 8px;
    }
    .arcana-picker-card.wrong { animation: arcana-wrong 240ms ease-in-out; }
    @keyframes arcana-wrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    .arcana-picker-grid.locked .arcana-picker-card {
      opacity: 0.48;
      cursor: default;
    }
    .arcana-contemplation {
      max-height: min(58vh, 470px);
      padding: 8px;
    }
    .arcana-contemplation[hidden] { display: none; }
    .arcana-reference-rows {
      display: grid;
      gap: 8px;
    }
    .arcana-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="abacus-view" id="abacusView">
  <h1>Magical Abacus</h1>

  <div class="readouts">
    <div class="readout">
      <div class="lbl">TAROT</div>
      <div class="spread" id="spread"></div>
    </div>
  </div>
  <div class="toolbar">
    <div class="set-wrap">
      <button class="ctrl set-field" type="button" id="setField" aria-label="Open tarot keypad. Decimal value 0">0</button>
    </div>
  </div>

  <div class="keypad" id="keypad" aria-hidden="true">
    <div class="keypad-head">
      <span>TAROT KEYS</span>
      <div class="keypad-actions">
        <button class="ctrl" type="button" data-act="back">⌫</button>
        <button class="ctrl" type="button" data-act="hide">Hide</button>
        <button class="ctrl" type="button" id="clearBtn">AC</button>
      </div>
    </div>
    <div class="keypad-board" id="keys"></div>
  </div>

  <div class="stage">
    <div class="plate">
      <div class="abacus" id="abacus">
        <div class="h-rail top"></div>
        <div class="bar reckoning" title="Reckoning bar — beads touching it are counted"></div>

    const columns = PLACES.map((place) => ({

    }));

    const abacus = document.getElementById("abacus");

    function beadButton(deck, k, colIndex) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "bead " + (deck === "sixes" ? "top" : "bot");
      el.dataset.k = String(k);
      const worth = deck === "sixes" ? SIXES_VAL : ONES_VAL;
      el.setAttribute(
        "aria-label",
        `${deck} bead ${k} on rod ${colIndex + 1}, worth ${worth}`
      );
      el.addEventListener("click", () => tap(colIndex, deck, k));
      return el;
    }

    function build() {
      const places = document.getElementById("places");
      places.innerHTML = `<span class="pad"></span>`;
      columns.forEach((col, i) => {
        const power = COLS - 1 - i;

        const sixes = document.createElement("div");
        sixes.className = `col sixes c${i}`;
        sixes.innerHTML = `<div class="rod"></div><div class="stack"><div class="group-off"></div><div class="group-on"></div></div>`;
        const sOff = sixes.querySelector(".group-off");
        for (let k = 1; k <= SIXES_N; k++) sOff.appendChild(beadButton("sixes", k, i));

        const ones = document.createElement("div");
        ones.className = `col ones c${i}`;
        ones.innerHTML = `<div class="rod"></div><div class="stack"><div class="group-on"></div><div class="group-off"></div></div>`;
        const oOff = ones.querySelector(".group-off");
        for (let k = 1; k <= ONES_N; k++) oOff.appendChild(beadButton("ones", k, i));

        abacus.appendChild(sixes);
        abacus.appendChild(ones);
        col.sixesEl = sixes;
        col.onesEl = ones;

        const cell = document.createElement("span");
        cell.innerHTML = `<b>30<sup>${power}</sup></b><i>${col.place.toLocaleString("en-US")}</i>`;
        places.appendChild(cell);
      });
      places.insertAdjacentHTML("beforeend", `<span class="pad"></span>`);
    }

    function tap(i, deck, k) {
      const col = columns[i];
      if (deck === "sixes") {
        // Upper beads count when moved down toward the reckoning bar.
        const down = k > SIXES_N - col.sixes;
        col.sixes = down ? SIXES_N - k : SIXES_N - k + 1;
      } else {
        // Lower beads count when moved up toward the reckoning bar.
        col.ones = col.ones >= k ? k - 1 : k;
      }
      render();
    }

    function arrange(el, count, fromBottom) {
      const on = el.querySelector(".group-on");
      const off = el.querySelector(".group-off");
      const beads = [...on.children, ...off.children];
      beads.sort((a, b) => Number(a.dataset.k) - Number(b.dataset.k));
      const total = beads.length;
      beads.forEach((bead) => {
        const k = Number(bead.dataset.k);
        const active = fromBottom ? k > total - count : k <= count;
        if (active) on.appendChild(bead);
        else off.appendChild(bead);
      });
    }

    function digitOf(col) {
      return col.sixes * SIXES_VAL + col.ones * ONES_VAL;
    }

    function decimalValue() {
      return columns.reduce((s, c) => s + digitOf(c) * c.place, 0);
    }

    function digitGlyph(d) {
      const card = TAROT[d];
      return card ? card.key : String(d);
    }

    function digitName(d) {
      const card = TAROT[d];
      return card ? card.name : String(d);
    }

    function digitSlug(d) {
      const card = TAROT[d];
      return card ? card.slug : String(d);

    function cardImageSrc(v) {
      // Keep the revised Seven of Cups embedded so the single-file app also
      // works in iOS HTML viewers that cannot resolve neighboring assets.
      if (v === 27) return CARD_27_MONO;
      return CARD_IMG[v] || `cards/${String(v).padStart(2, "0")}.png`;
    }

    function toBase30Glyphs(n) {
      n = Math.max(0, Math.floor(n));
      if (n === 0) return [digitSlug(0)];
      const out = [];
      let x = n;
      while (x > 0) {
        out.unshift(digitSlug(x % BASE));
        x = Math.floor(x / BASE);
      }
      return out;
    }

    function toBase30(n) {
      return toBase30Glyphs(n).join(" ");
    }

    function formatBase30(n, width) {
      const g = toBase30Glyphs(n);
      while (g.length < width) g.unshift(digitSlug(0));
      return g.map((slug) => (TAROT_BY_SLUG[slug] || {}).key || slug).join(" · ");
    }

    function tokenize(raw) {
      const t = String(raw).trim().toLowerCase()
        .replace(/−/g, "-")
        .replace(/₃₀$/u, "")
        .replace(/·/g, " ");
      if (!t) return [];
      const slugs = TAROT.map((c) => c.slug).sort((a, b) => b.length - a.length);
      const tokens = [];
      let i = 0;
      while (i < t.length) {
        while (t[i] === " ") i++;
        if (i >= t.length) break;
        if (t[i] === "+" || t[i] === "-") {
          tokens.push(t[i]);
          i += 1;
          continue;
        }
        const rest = t.slice(i);
        const slug = slugs.find((s) => rest === s || rest.startsWith(s + " ") || rest.startsWith(s + "+") || rest.startsWith(s + "-"));
        if (!slug) return null;
        tokens.push(slug);
        i += slug.length;
      }
      return tokens;
    }

    function parseBase30Tokens(tokens) {
      if (!tokens || !tokens.length) return NaN;
      let n = 0;
      for (const tok of tokens) {
        if (!(tok in DIGIT_VALUE)) return NaN;
        n = n * BASE + DIGIT_VALUE[tok];
      }
      return n;
    }

    function parseBase30Num(raw) {
      const tokens = tokenize(raw);
      if (!tokens || tokens.some((tok) => tok === "+" || tok === "-")) return NaN;
      return parseBase30Tokens(tokens);
    }

    function parseExpression(raw) {
      const tokens = tokenize(raw);
      if (!tokens) return String(raw).trim() ? NaN : 0;
      const opAt = tokens.findIndex((tok) => tok === "+" || tok === "-");
      if (opAt === -1) return parseBase30Tokens(tokens);
      if (opAt === 0 || opAt !== tokens.lastIndexOf(tokens[opAt]) || opAt === tokens.length - 1) return NaN;
      const a = parseBase30Tokens(tokens.slice(0, opAt));
      const b = parseBase30Tokens(tokens.slice(opAt + 1));
      if (!Number.isFinite(a) || !Number.isFinite(b)) return NaN;
      return tokens[opAt] === "+" ? a + b : a - b;
    }

    function setNumber(n) {
      const max = BASE ** COLS - 1;
      n = Math.max(0, Math.min(max, Math.floor(n)));
      let rest = n;
      columns.forEach((c) => {
        const d = Math.floor(rest / c.place);
        rest -= d * c.place;
        c.sixes = Math.min(SIXES_N, Math.floor(d / SIXES_VAL));
        c.ones = Math.min(ONES_N, d % SIXES_VAL);
      });
      render();
    }

    function clearAll() {
      columns.forEach((c) => {
        c.sixes = 0;
        c.ones = 0;
      });
      typed = "";
      pendingOp = "";
      bracketValue = null;
      multiplyDigits = 2;
      syncField();
      hideKeypad();
      render();
    }

    function render() {
      columns.forEach((col) => {
        arrange(col.sixesEl, col.sixes, true);
        arrange(col.onesEl, col.ones, false);
      });

      const n = decimalValue();
      const spread = document.getElementById("spread");
      const slugs = toBase30Glyphs(n);
      while (slugs.length < COLS) slugs.unshift(digitSlug(0));
      const renderCard = (slug) => {
        const card = TAROT_BY_SLUG[slug];
        const v = card ? card.v : 0;
        const src = cardImageSrc(v);
        return `<span class="spread-card"><img src="${src}" alt="${card ? card.name : slug} = ${v}"></span>`;
      };
      const cardCount = slugs[0] !== digitSlug(0)
        ? 5
        : slugs[1] !== digitSlug(0)
          ? 4
          : 3;
      const visibleCards = slugs.slice(COLS - cardCount).map(renderCard).join("");
      spread.innerHTML = `<div class="spread-row spread-${cardCount}">${visibleCards}</div>`;
      syncField();
    }

    const field = document.getElementById("setField");
    const keypad = document.getElementById("keypad");
    const keys = document.getElementById("keys");
    let typed = "";
    let pendingOp = "";
    let bracketValue = null;
    let multiplyDigits = 2;

    function selectedDecimal() {
      return parseBase30Num(typed);
    }

    function formatBase30Tuple(value) {
      let remaining = Math.abs(Math.trunc(value));
      const digits = [];
      do {
        digits.unshift(remaining % BASE);
        remaining = Math.floor(remaining / BASE);
      } while (remaining > 0);
      return `(${digits.join(", ")})`;
    }

    function syncField() {
      const beadNumber = decimalValue();
      const keypadOpen = field.classList.contains("open");
      let display = keypadOpen
        ? formatBase30Tuple(beadNumber)
        : beadNumber.toLocaleString("en-US");
      if (keypadOpen && pendingOp) {
        const bracketedDisplay = Number.isFinite(bracketValue)
          ? `(0 + ${formatBase30Tuple(bracketValue)})`
          : display;
        if (pendingOp === "*") {
          const tokens = tokenize(typed) || [];
          const selectedCards = tokens.map((token) => {
            const card = TAROT_BY_SLUG[token];
            return card ? card.v : "_";
          });
          const multiplierDisplay = selectedCards.length
            ? `(${selectedCards.join(", ")})`
            : "(_)";
          display = `${bracketedDisplay} × ${multiplierDisplay}`;
        } else {
          const selection = selectedDecimal();
          const symbol = pendingOp === "-" ? "−" : "+";
          display = `${bracketedDisplay} ${symbol}`;
          if (Number.isFinite(selection)) {
            display += ` ${formatBase30Tuple(selection)}`;
          }
        }
      }
      field.textContent = display;
      field.setAttribute("aria-label", `Open tarot keypad. ${display}`);
    }

    function showKeypad() {
      typed = "";
      pendingOp = decimalValue() === 0 ? "+" : "";
      bracketValue = null;
      multiplyDigits = 2;
      keypad.classList.add("show");
      keypad.setAttribute("aria-hidden", "false");
      field.classList.add("open");
      syncField();
    }

    function hideKeypad() {
      typed = "";
      pendingOp = "";
      bracketValue = null;
      multiplyDigits = 2;
      keypad.classList.remove("show");
      keypad.setAttribute("aria-hidden", "true");
      field.classList.remove("open");
      syncField();
    }

    function makeKey(k, extraClass) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "key" + (extraClass ? " " + extraClass : "");
      btn.dataset.k = k === "−" ? "-" : k === "×" ? "*" : k;
      btn.textContent = k;
      return btn;
    }

    keys.appendChild(makeKey("+", "op op-plus"));
    keys.appendChild(makeKey("−", "op op-minus"));
    keys.appendChild(makeKey("×", "op op-multiply"));
    const setKey = makeKey("Set", "op op-zero");
    delete setKey.dataset.k;
    setKey.dataset.act = "set";
    keys.appendChild(setKey);
    TAROT.forEach((card) => {
      const btn = makeKey(card.key, "card");
      btn.dataset.k = card.slug;
      btn.title = card.name + " = " + card.v;
      btn.textContent = "";
      const img = document.createElement("img");
      img.src = cardImageSrc(card.v);
      img.alt = card.name + " =" + card.v;
      btn.appendChild(img);
      keys.appendChild(btn);
    });

    field.addEventListener("click", () => {
      if (keypad.classList.contains("show")) hideKeypad();
      else showKeypad();
    });

    keypad.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-k], [data-act]");
      if (!btn) return;
      if (btn.dataset.act === "back") {
        const tokens = tokenize(typed) || [];
        tokens.pop();
        typed = tokens.join(" ").replace(/\s+([+-])\s+/g, " $1 ").replace(/\s+/g, " ").trim();
        syncField();
        return;
      }
      if (btn.dataset.act === "hide") {
        hideKeypad();
        return;
      }
      if (btn.dataset.act === "set") {
        applySet();
        return;
      }
      if (btn.dataset.k) {
        const k = btn.dataset.k;
        if (k === "+" || k === "-") {
          const selection = selectedDecimal();
          if (
            decimalValue() === 0 &&
            pendingOp === "+" &&
            Number.isFinite(selection)
          ) {
            bracketValue = selection;
            typed = "";
          } else if (!(Number.isFinite(bracketValue) && !typed.trim())) {
            bracketValue = null;
          }
          pendingOp = k;
          multiplyDigits = 2;
          syncField();
          return;
        }
        if (k === "*") {
          const selection = selectedDecimal();
          if (
            decimalValue() === 0 &&
            pendingOp === "+" &&
            Number.isFinite(selection) &&
            selection < BASE ** 4
          ) {
            bracketValue = selection;
          } else if (!(Number.isFinite(bracketValue) && !typed.trim())) {
            bracketValue = null;
          }
          typed = "";
          pendingOp = "*";
          multiplyDigits = 2;
          syncField();
          return;
        }
        if (pendingOp === "*") {
          const tokens = tokenize(typed) || [];
          if (tokens.length >= multiplyDigits) return;
          tokens.push(k);
          typed = tokens.join(" ");
          const selectedCount = tokens.length;
          const clearedColumn = columns[selectedCount - 1];
          clearedColumn.sixes = 0;
          clearedColumn.ones = 0;
          if (Number.isFinite(bracketValue)) {
            bracketValue %= BASE ** (COLS - selectedCount);
          }
          render();
          return;
        }
        const tokens = tokenize(typed) || [];
        if (tokens.length >= COLS) return;
        typed = (typed + " " + k).replace(/\s+/g, " ").trim();
        syncField();
      }
    });

    function applySet() {
      let selection = selectedDecimal();
      if (pendingOp === "*") {
        const tokens = tokenize(typed);
        if (!tokens || tokens.length < 1 || tokens.length > multiplyDigits) return;
      }
      if (!Number.isFinite(selection)) return;
      const beadValue = decimalValue();
      const leftValue = Number.isFinite(bracketValue)
        ? bracketValue
        : beadValue;
      let result = pendingOp === "+"
        ? leftValue + selection
        : pendingOp === "-"
          ? leftValue - selection
          : pendingOp === "*"
            ? leftValue * selection
            : selection;
      const max = BASE ** COLS - 1;
      if (pendingOp === "+" && result > max) result -= max;
      setNumber(Math.abs(result));
      hideKeypad();
    }

    const ARCANA_ROWS = [];
    let arcanaReady = false;
    let arcanaRowIndex = -1;
    let arcanaRow = null;
    let arcanaAnswers = [null, null];

    for (let left = 2; left < BASE; left++) {
      for (let right = left; right < BASE; right++) {
        const product = left * right;
        if (product < BASE || product >= BASE ** 2) continue;
        ARCANA_ROWS.push({
          left,
          right,
          result: [Math.floor(product / BASE), product % BASE]
        });
      }
    }

    function showAbacusView() {
      arcanaView.hidden = true;
      arcanaView.setAttribute("aria-hidden", "true");
      abacusView.hidden = false;
      hideArcanaContemplation();
      window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
    }

    function showArcanaView() {
      if (!arcanaReady) {
        buildArcanaPicker();
        arcanaReady = true;
      }
      hideKeypad();
      abacusView.hidden = true;
      arcanaView.hidden = false;
      arcanaView.setAttribute("aria-hidden", "false");
      dealArcanaChallenge();
      window.scrollTo({ top: 0, left: 0, behavior: "auto" });
    }

    function arcanaCardMarkup(value, unknown = false, reference = false) {
      const src = unknown ? ARCANA_BACK_SRC : cardImageSrc(value);
      const cardClass = reference ? "arcana-reference-card" : "arcana-challenge-card";
      const alt = unknown ? "Endless Journey, unknown result card" : `${TAROT[value].name}, ${value}`;
      return `<span class="${cardClass}"><img src="${src}" alt="${alt}"></span>`;
    }

    function renderArcanaChallenge() {
      arcanaChallenge.innerHTML = [
        arcanaCardMarkup(arcanaRow.left),
        arcanaCardMarkup(arcanaRow.right),
        arcanaAnswers[0] === null ? arcanaCardMarkup(null, true) : arcanaCardMarkup(arcanaAnswers[0]),
        arcanaAnswers[1] === null ? arcanaCardMarkup(null, true) : arcanaCardMarkup(arcanaAnswers[1])
      ].join("");
      const complete = arcanaAnswers.every((answer) => answer !== null);
      arcanaPicker.classList.toggle("locked", complete);
      arcanaPicker.querySelectorAll("button").forEach((button) => { button.disabled = complete; });
      arcanaChallenge.setAttribute(
        "aria-label",
        complete
          ? `${TAROT[arcanaRow.left].name} times ${TAROT[arcanaRow.right].name}; answer complete. Tap Multiply Thy Arcana for a new challenge.`
          : `${TAROT[arcanaRow.left].name} times ${TAROT[arcanaRow.right].name}; choose result card ${arcanaAnswers[0] === null ? "one" : "two"}.`
      );
    }

    function dealArcanaChallenge() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * ARCANA_ROWS.length);
      } while (ARCANA_ROWS.length > 1 && nextIndex === arcanaRowIndex);
      arcanaRowIndex = nextIndex;
      arcanaRow = ARCANA_ROWS[nextIndex];
      arcanaAnswers = [null, null];
      hideArcanaContemplation();
      renderArcanaChallenge();
      arcanaPickerWindow.scrollTo({ top: 0, behavior: "smooth" });
      arcanaStatus.textContent = "A new Arcana challenge has been dealt.";
    }

    function buildArcanaPicker() {
      const fragment = document.createDocumentFragment();
      TAROT.forEach((card) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "key card arcana-picker-card";
        button.dataset.value = String(card.v);
        button.setAttribute("aria-label", `${card.name}, ${card.v}`);
        const image = document.createElement("img");
        image.src = cardImageSrc(card.v);
        image.alt = `${card.name}, ${card.v}`;
        image.decoding = "async";
        button.appendChild(image);
        fragment.appendChild(button);
      });
      arcanaPicker.appendChild(fragment);
      arcanaPicker.querySelectorAll("img").forEach((image) => {
        if (!image.complete) image.addEventListener("load", sizeArcanaPickerWindow, { once: true });
      });
      sizeArcanaPickerWindow();
      if ("ResizeObserver" in window) {
        new ResizeObserver(sizeArcanaPickerWindow).observe(arcanaPicker);
      }
    }

    function sizeArcanaPickerWindow() {
      requestAnimationFrame(() => {
        const cards = arcanaPicker.querySelectorAll(".arcana-picker-card");
        const thirdRowCard = cards[10];
        if (!thirdRowCard) return;
        const pickerRect = arcanaPicker.getBoundingClientRect();
        const thirdRowRect = thirdRowCard.getBoundingClientRect();
        const pickerStyle = getComputedStyle(arcanaPicker);
        const windowStyle = getComputedStyle(arcanaPickerWindow);
        const paddingBottom = parseFloat(pickerStyle.paddingBottom) || 0;
        const borders = (parseFloat(windowStyle.borderTopWidth) || 0) + (parseFloat(windowStyle.borderBottomWidth) || 0);
        arcanaPickerWindow.style.height = `${Math.ceil(thirdRowRect.bottom - pickerRect.top + paddingBottom + borders)}px`;
      });
    }

    function hideArcanaContemplation() {
      arcanaContemplation.hidden = true;
      contemplateStars.setAttribute("aria-expanded", "false");
    }

    function showArcanaContemplation() {
      const relatedRows = ARCANA_ROWS.filter((row) => row.left === arcanaRow.left);
      arcanaReferenceRows.innerHTML = relatedRows.map((row) => `
        <div class="arcana-reference-row" aria-label="${TAROT[row.left].name} times ${TAROT[row.right].name}">
          ${arcanaCardMarkup(row.left, false, true)}
          ${arcanaCardMarkup(row.right, false, true)}
          ${arcanaCardMarkup(row.result[0], false, true)}
          ${arcanaCardMarkup(row.result[1], false, true)}
        </div>
      `).join("");
      arcanaContemplation.hidden = false;
      contemplateStars.setAttribute("aria-expanded", "true");
      arcanaContemplation.scrollTo({ top: 0, behavior: "auto" });
    }

    arcanaPicker.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-value]");
      if (!button || button.disabled) return;
      hideArcanaContemplation();
      const nextSlot = arcanaAnswers.findIndex((answer) => answer === null);
      if (nextSlot === -1) return;
      const selectedValue = Number(button.dataset.value);
      if (selectedValue !== arcanaRow.result[nextSlot]) {
        button.classList.remove("wrong");
        void button.offsetWidth;
        button.classList.add("wrong");
        arcanaStatus.textContent = "That card is not the next card in the result.";
        return;
      }
      arcanaAnswers[nextSlot] = selectedValue;
      renderArcanaChallenge();
      arcanaStatus.textContent = nextSlot === 0
        ? "First result card chosen. Choose the second."
        : "Answer complete. Tap Multiply Thy Arcana for a new challenge.";
    });

    document.getElementById("arcanaTitle").addEventListener("click", () => {
      dealArcanaChallenge();
      window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
    });
    contemplateStars.addEventListener("click", () => {
      if (arcanaContemplation.hidden) showArcanaContemplation();
      else hideArcanaContemplation();
    });
    document.getElementById("takeUpAbacus").addEventListener("click", showAbacusView);
    document.getElementById("learnDivineSecrets").addEventListener("click", showArcanaView);
    window.addEventListener("resize", sizeArcanaPickerWindow);
  </script>
